name: Live Performance Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-performance.yml'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/lighthouse-budget.mjs'
      - 'next.config.js'
      - 'package*.json'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional storefront URL override for this audit'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AX_PERFORMANCE_BASE_URL: ${{ inputs.base_url || vars.AX_PERFORMANCE_BASE_URL || 'https://aqua-oyster-550932.hostingersite.com' }}
      AX_PERFORMANCE_DEPLOY_WAIT_SECONDS: ${{ vars.AX_PERFORMANCE_DEPLOY_WAIT_SECONDS || '90' }}
      AX_LH_MIN_PERF: ${{ vars.AX_LH_MIN_PERF || '80' }}
      AX_LH_MAX_LCP_MS: ${{ vars.AX_LH_MAX_LCP_MS || '3500' }}
      AX_LH_MAX_CLS: ${{ vars.AX_LH_MAX_CLS || '0.10' }}
      AX_LH_MAX_TBT_MS: ${{ vars.AX_LH_MAX_TBT_MS || '300' }}
      AX_LH_MAX_BYTES: ${{ vars.AX_LH_MAX_BYTES || '4500000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit live AX storefront
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          BASE="${AX_PERFORMANCE_BASE_URL%/}"
          BUDGET_FAILED=0

          if [[ ! "${BASE}" =~ ^https:// ]]; then
            echo "AX_PERFORMANCE_BASE_URL must be an https URL."
            exit 1
          fi

          echo "Performance target: ${BASE}"
          echo "Waiting ${AX_PERFORMANCE_DEPLOY_WAIT_SECONDS}s for the storefront deployment..."
          sleep "${AX_PERFORMANCE_DEPLOY_WAIT_SECONDS}"

          wait_for_page() {
            label="$1"
            path="$2"
            url="${BASE}${path}"
            echo "Checking ${label}: ${url}"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 10 --retry-all-errors \
              --connect-timeout 15 --max-time 45 \
              --user-agent "AX-V3-Lighthouse/1.0" \
              --output /dev/null "${url}"
          }

          audit_page() {
            label="$1"
            path="$2"
            output="lighthouse-${label}.json"

            wait_for_page "${label}" "${path}"

            attempt=1
            while true; do
              rm -f "${output}"
              if npx --yes lighthouse@12.8.2 "${BASE}${path}" \
                --quiet \
                --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu" \
                --only-categories=performance \
                --max-wait-for-load=45000 \
                --output=json \
                --output-path="${output}"; then
                break
              fi

              if [ "${attempt}" -ge 3 ]; then
                echo "Lighthouse failed three times for ${label}."
                return 1
              fi

              attempt=$((attempt+1))
              delay=$((attempt*15))
              echo "Retrying Lighthouse for ${label} in ${delay}s..."
              sleep "${delay}"
              wait_for_page "${label}" "${path}"
            done

            node - "${label}" "${output}" <<'NODE'
          const fs=require('fs');
          const label=process.argv[2],file=process.argv[3];
          const r=JSON.parse(fs.readFileSync(file,'utf8')),a=r.audits;
          const out={
            page:label,
            performance:Math.round((r.categories.performance.score||0)*100),
            fcp:a['first-contentful-paint']?.displayValue,
            lcp:a['largest-contentful-paint']?.displayValue,
            tbt:a['total-blocking-time']?.displayValue,
            cls:a['cumulative-layout-shift']?.displayValue,
            speedIndex:a['speed-index']?.displayValue,
            serverResponse:a['server-response-time']?.displayValue,
            transferSize:a['total-byte-weight']?.displayValue
          };
          console.log('AX_LIGHTHOUSE_RESULT '+JSON.stringify(out));
          const findings=Object.entries(a)
            .filter(([,v])=>v && v.score!==null && v.score<1 && (v.details?.overallSavingsMs>0 || v.details?.overallSavingsBytes>0 || ['largest-contentful-paint-element','render-blocking-resources','unused-javascript','unused-css-rules','modern-image-formats','uses-responsive-images','offscreen-images','uses-long-cache-ttl','network-requests','mainthread-work-breakdown'].includes(v.id)))
            .map(([id,v])=>({id,title:v.title,score:v.score,displayValue:v.displayValue,savingsMs:v.details?.overallSavingsMs||0,savingsBytes:v.details?.overallSavingsBytes||0}))
            .sort((x,y)=>(y.savingsMs-x.savingsMs)||(y.savingsBytes-x.savingsBytes))
            .slice(0,10);
          console.log('AX_LIGHTHOUSE_FINDINGS '+JSON.stringify({page:label,findings}));
          NODE

            if ! node scripts/lighthouse-budget.mjs "${label}" "${output}"; then
              BUDGET_FAILED=1
            fi
          }

          resolve_product_path() {
            tmp="$(mktemp)"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 10 --retry-all-errors \
              --connect-timeout 15 --max-time 45 \
              --user-agent "AX-V3-Lighthouse/1.0" \
              --output "${tmp}" "${BASE}/products"

            path="$(node - "${tmp}" <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync(process.argv[2], 'utf8');
          const match = html.match(/href="(\/products\/[^"?#]+)"/);
          process.stdout.write(match ? match[1] : '');
          NODE
            )"
            rm -f "${tmp}"

            if [ -z "${path}" ]; then
              echo "Could not discover a live product link from /products." >&2
              return 1
            fi

            printf '%s' "${path}"
          }

          audit_page home "/"
          sleep 10
          audit_page products "/products"
          sleep 10
          PDP_PATH="$(resolve_product_path)"
          echo "Discovered live PDP for audit: ${PDP_PATH}"
          audit_page product-detail "${PDP_PATH}"

          if [ "${BUDGET_FAILED}" -ne 0 ]; then
            echo "One or more Lighthouse budgets failed."
            exit 1
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.sha }}
          path: lighthouse-*.json
          if-no-files-found: ignore
          retention-days: 14
