name: Restock Processor

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: ax-restock-processor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger protected restock processor
        env:
          PROCESSOR_URL: ${{ vars.AX_RESTOCK_PROCESSOR_URL }}
          PROCESSOR_SECRET: ${{ secrets.AX_RESTOCK_PROCESSOR_SECRET }}
        run: |
          if [ -z "$PROCESSOR_URL" ] || [ -z "$PROCESSOR_SECRET" ]; then
            echo "Restock processor is not activated yet; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error             --max-time 45             --retry 2             --retry-all-errors             -X POST "$PROCESSOR_URL"             -H "Authorization: Bearer $PROCESSOR_SECRET"             -H "Content-Type: application/json"
