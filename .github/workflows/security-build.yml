name: Security & Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AX_ALLOW_INDEXING: 'false'
      AX_STYLIST_ENABLED: 'false'
      AX_STYLIST_IMAGES_ENABLED: 'false'
      AX_SITE_ORIGIN: 'https://example.com'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Reject committed environment files
        shell: bash
        run: |
          tracked_env="$(git ls-files | grep -E '(^|/)\.env' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Unexpected environment file(s) committed:"
            echo "$tracked_env"
            exit 1
          fi

      - name: Validate workflow syntax
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/check-workflows.py

      - name: Security invariants
        run: node scripts/security-invariants.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

      - name: Storefront smoke tests
        run: node scripts/smoke.mjs

      - name: Install browser test tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Browser regression and accessibility tests
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
