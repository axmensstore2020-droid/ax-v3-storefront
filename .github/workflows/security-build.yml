name: Security & Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AX_ALLOW_INDEXING: 'false'
      AX_STYLIST_ENABLED: 'false'
      AX_STYLIST_IMAGES_ENABLED: 'false'
      AX_SITE_ORIGIN: 'https://example.com'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reject committed environment files
        shell: bash
        run: |
          tracked_env="$(git ls-files | grep -E '(^|/)\.env' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Unexpected environment file(s) committed:"
            echo "$tracked_env"
            exit 1
          fi

      - name: Security invariants
        run: node scripts/security-invariants.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build
