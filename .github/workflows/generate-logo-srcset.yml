name: Generate AX logo srcset

on:
  push:
    branches: [perf/logo-srcset]
    paths:
      - '.github/workflows/generate-logo-srcset.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/logo-srcset
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate responsive logo sizes
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('public/ax-logo.webp')
          im=Image.open(src).convert('RGBA')
          for width in (96,160,240):
              height=max(1,round(im.height*width/im.width))
              out=im.resize((width,height),Image.Resampling.LANCZOS)
              path=Path(f'public/ax-logo-{width}.webp')
              out.save(path,'WEBP',lossless=True,method=6)
              print(width,height,path.stat().st_size)
          PY
      - name: Commit responsive logo assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ax-logo-96.webp public/ax-logo-160.webp public/ax-logo-240.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add responsive AX logo sizes"
          git push origin HEAD:perf/logo-srcset
