name: Optimize AX logo asset

on:
  push:
    branches: [perf/logo-asset]
    paths:
      - '.github/workflows/optimize-logo.yml'
      - 'public/ax-logo.jpg'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/logo-asset
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create transparent optimized WebP
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path

          src=Path('public/ax-logo.jpg')
          dst=Path('public/ax-logo.webp')

          im=Image.open(src).convert('RGB')
          gray=im.convert('L')
          alpha=ImageChops.invert(gray)

          # Ignore tiny JPEG noise in the nominally white background.
          alpha=alpha.point(lambda p: 0 if p < 10 else p)
          bbox=alpha.getbbox()
          if not bbox:
              raise SystemExit('No logo artwork detected in ax-logo.jpg')

          left,top,right,bottom=bbox
          pad=max(8,round(max(right-left,bottom-top)*0.035))
          left=max(0,left-pad); top=max(0,top-pad)
          right=min(im.width,right+pad); bottom=min(im.height,bottom+pad)

          alpha=alpha.crop((left,top,right,bottom))
          rgba=Image.new('RGBA', alpha.size, (0,0,0,0))
          black=Image.new('RGBA', alpha.size, (0,0,0,255))
          rgba.paste(black,(0,0),alpha)

          target_w=320
          target_h=max(1,round(rgba.height*target_w/rgba.width))
          rgba=rgba.resize((target_w,target_h),Image.Resampling.LANCZOS)
          rgba.save(dst,'WEBP',lossless=True,method=6)

          print(f'original={src.stat().st_size} bytes {im.size}')
          print(f'optimized={dst.stat().st_size} bytes {rgba.size}')
          print(f'crop={(left,top,right,bottom)}')
          PY
      - name: Commit optimized logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ax-logo.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add optimized transparent AX logo"
          git push origin HEAD:perf/logo-asset
